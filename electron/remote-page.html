<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0c0f15" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f7" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Dial TV Remote</title>
<style>
  :root {
    --bg: #f3f4f7; --card: #ffffff; --btn: #e7e9ee; --btn-press: #d5d9e1; --text: #12151b; --muted: #5f6673;
    --line: #d9dce3; --accent: #e23b3b; --accent-text: #fff; --good: #1d9a55; --bad: #c53030;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #080a0f; --card: #10141b; --btn: #1a1f29; --btn-press: #262d3a; --text: #f4f5f7; --muted: #8b92a0; --line: #232833; --accent: #ff4d4d; --good: #3ccf7a; --bad: #ff5a5a; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { padding: max(14px, env(safe-area-inset-top)) 14px max(20px, env(safe-area-inset-bottom)); max-width: 520px; margin: 0 auto; }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  .hidden { display: none !important; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .brand { font-weight: 800; letter-spacing: .04em; }
  .brand span { color: var(--accent); }
  .dot { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--bad); }
  .dot.on::before { background: var(--good); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin-bottom: 14px; }
  .np small { color: var(--muted); font-weight: 700; font-size: 12px; letter-spacing: .06em; }
  .np h1 { margin: 2px 0 4px; font-size: 22px; line-height: 1.2; overflow-wrap: anywhere; }
  .np p { margin: 0; color: var(--muted); overflow-wrap: anywhere; }
  .np p b { color: var(--text); font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
  .k { background: var(--btn); border-radius: 16px; min-height: 68px; font-weight: 700; font-size: 17px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .k small { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .06em; }
  .k:active, .k.press { background: var(--btn-press); transform: scale(.98); }
  .k.accent { background: var(--accent); color: var(--accent-text); }
  .k.accent small { color: inherit; opacity: .85; }
  .k svg { width: 26px; height: 26px; }
  h2 { font-size: 13px; letter-spacing: .08em; color: var(--muted); margin: 18px 4px 8px; }
  .entry { font: 700 28px ui-monospace, Menlo, monospace; text-align: center; min-height: 40px; letter-spacing: .1em; }
  .pad .k { min-height: 60px; font-size: 22px; }
  .favs { display: flex; flex-direction: column; gap: 8px; }
  .fav { background: var(--card); border: 1px solid var(--line); border-radius: 14px; min-height: 56px; padding: 10px 14px; display: flex; align-items: center; gap: 12px; text-align: left; }
  .fav b { font: 700 14px ui-monospace, Menlo, monospace; color: var(--muted); min-width: 44px; }
  .fav span { flex: 1; font-weight: 600; overflow-wrap: anywhere; }
  .fav.on { border-color: var(--accent); }
  .fav.on b { color: var(--accent); }
  .empty { color: var(--muted); padding: 6px 4px; }
  form { display: flex; flex-direction: column; gap: 12px; }
  label { font-size: 13px; color: var(--muted); font-weight: 600; }
  input { font: inherit; color: var(--text); background: var(--btn); border: 1px solid var(--line); border-radius: 12px; padding: 14px; width: 100%; }
  input.code { font: 700 30px ui-monospace, Menlo, monospace; letter-spacing: .3em; text-align: center; }
  .primary { background: var(--accent); color: var(--accent-text); border-radius: 14px; min-height: 56px; font-weight: 800; font-size: 17px; }
  .msg { min-height: 1.4em; color: var(--bad); margin: 0; }
  .help { color: var(--muted); font-size: 14px; margin: 0; }
  .toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px; }
</style>
</head>
<body>
<header><div class="brand">DIAL <span>TV</span> REMOTE</div><div class="dot" id="dot">Offline</div></header>

<section id="pairView" class="card hidden">
  <form id="pairForm" autocomplete="off">
    <p class="help">Open <b>Settings → Remote</b> in Dial TV on your computer and type the 6-digit code shown there.</p>
    <label for="code">Pairing code</label>
    <input id="code" class="code" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" required>
    <label for="name">Name for this phone</label>
    <input id="name" maxlength="40">
    <p class="msg" id="pairMsg"></p>
    <button class="primary" type="submit">Pair</button>
  </form>
</section>

<main id="remoteView" class="hidden">
  <section class="card np" aria-live="polite">
    <small id="npCh">—</small>
    <h1 id="npName">Not playing</h1>
    <p id="npTitle"></p>
    <p id="npTime"></p>
    <p id="npNext"></p>
  </section>

  <div class="grid">
    <button class="k" data-cmd="chup" aria-label="Channel up"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg><small>CH</small></button>
    <button class="k accent" data-cmd="play" aria-label="Play or pause"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 4.5v15l8-7.5zM15 5h3v14h-3z"/></svg><small>PLAY / PAUSE</small></button>
    <button class="k" data-cmd="volup" aria-label="Volume up"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><small>VOL</small></button>
    <button class="k" data-cmd="chdown" aria-label="Channel down"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg><small>CH</small></button>
    <button class="k" data-cmd="mute" aria-label="Mute"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4zM22 9l-6 6M16 9l6 6"/></svg><small>MUTE</small></button>
    <button class="k" data-cmd="voldown" aria-label="Volume down"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14"/></svg><small>VOL</small></button>
    <button class="k" data-cmd="last" aria-label="Last channel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg><small>LAST</small></button>
    <button class="k" data-cmd="guide" aria-label="Guide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 10v10"/></svg><small>GUIDE</small></button>
    <button class="k" id="padToggle" aria-expanded="false" aria-label="Number pad"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="6" cy="6" r="2"/><circle cx="12" cy="6" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="6" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="18" cy="12" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="12" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></svg><small>123</small></button>
  </div>

  <section id="pad" class="card hidden">
    <div class="entry" id="entry" aria-live="polite"></div>
    <div class="grid pad">
      <button class="k" data-d="1">1</button><button class="k" data-d="2">2</button><button class="k" data-d="3">3</button>
      <button class="k" data-d="4">4</button><button class="k" data-d="5">5</button><button class="k" data-d="6">6</button>
      <button class="k" data-d="7">7</button><button class="k" data-d="8">8</button><button class="k" data-d="9">9</button>
      <button class="k" id="padClear" aria-label="Clear"><small>CLEAR</small></button><button class="k" data-d="0">0</button><button class="k accent" id="padGo" aria-label="Tune"><small>GO</small></button>
    </div>
  </section>

  <h2>FAVORITES</h2>
  <div class="favs" id="favs"><p class="empty">Star channels in Dial TV to see them here.</p></div>
</main>

<div id="toast" class="toast hidden" role="status"></div>

<script>
(() => {
  'use strict';
  const KEY = 'dialtv.remote.token';
  const $ = (id) => document.getElementById(id);
  const store = {
    get() { try { return localStorage.getItem(KEY); } catch { return null; } },
    set(v) { try { v ? localStorage.setItem(KEY, v) : localStorage.removeItem(KEY); } catch { /* private mode */ } },
  };
  let token = store.get();
  let ws = null;
  let retry = 0;
  let retryTimer = 0;
  let state = null;

  function toast(text) {
    const t = $('toast');
    t.textContent = text;
    t.classList.remove('hidden');
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => t.classList.add('hidden'), 2500);
  }
  function setOnline(on) {
    const d = $('dot');
    d.classList.toggle('on', on);
    d.textContent = on ? 'Connected' : 'Reconnecting…';
  }
  function show(view) {
    $('pairView').classList.toggle('hidden', view !== 'pair');
    $('remoteView').classList.toggle('hidden', view !== 'remote');
    if (view === 'pair') { $('dot').classList.remove('on'); $('dot').textContent = 'Not paired'; setTimeout(() => $('code').focus(), 50); }
  }

  function defaultName() {
    const ua = navigator.userAgent;
    if (/iPhone/.test(ua)) return 'iPhone';
    if (/iPad/.test(ua)) return 'iPad';
    if (/Android/.test(ua)) return 'Android phone';
    return 'Phone';
  }
  $('name').value = defaultName();

  $('pairForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const code = $('code').value.replace(/\D/g, '');
    const msg = $('pairMsg');
    msg.textContent = '';
    if (code.length !== 6) { msg.textContent = 'Enter all 6 digits.'; return; }
    try {
      const res = await fetch('/pair', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code, name: $('name').value }) });
      const body = await res.json().catch(() => ({}));
      if (res.ok && body.token) {
        token = body.token;
        store.set(token);
        $('code').value = '';
        show('remote');
        connect();
      } else if (res.status === 429) {
        msg.textContent = 'Too many wrong codes. Try again in ' + Math.ceil((body.retryAfterSec || 60) / 60) + ' min.';
      } else {
        msg.textContent = 'Wrong code. Check the code on the computer.';
        $('code').select();
      }
    } catch {
      msg.textContent = 'Can’t reach Dial TV. Is the computer on and Remote turned on?';
    }
  });

  function connect() {
    clearTimeout(retryTimer);
    if (!token) return show('pair');
    if (ws) { ws.onclose = null; try { ws.close(); } catch { /* */ } }
    const sock = new WebSocket('ws://' + location.host + '/ws');
    ws = sock;
    sock.onopen = () => { retry = 0; setOnline(true); sock.send(JSON.stringify({ t: token, type: 'hello' })); };
    sock.onmessage = (ev) => {
      let m;
      try { m = JSON.parse(ev.data); } catch { return; }
      if (m.type === 'unauthorized') {
        token = null;
        store.set(null);
        sock.onclose = null;
        show('pair');
        $('pairMsg').textContent = 'This phone was removed from Dial TV. Pair it again.';
      } else if (m.type === 'state') {
        state = m.state;
        render();
      }
    };
    sock.onclose = () => {
      if (ws !== sock) return;
      setOnline(false);
      retryTimer = setTimeout(connect, Math.min(10000, 500 * 2 ** retry++));
    };
  }
  // Phones suspend background pages: reconnect at once when the page comes back.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && token && (!ws || ws.readyState > 1)) { retry = 0; connect(); }
  });

  function send(cmd) {
    if (!ws || ws.readyState !== 1) { toast('Not connected'); return; }
    ws.send(JSON.stringify({ t: token, type: 'cmd', cmd }));
    if (navigator.vibrate) navigator.vibrate(12);
  }

  function render() {
    const s = state || {};
    const ch = s.channel;
    $('npCh').textContent = ch ? 'CH ' + ch.number + (s.guideOpen ? ' · GUIDE OPEN' : '') : '—';
    $('npName').textContent = ch ? ch.name : 'Not playing';
    const title = $('npTitle');
    title.textContent = '';
    if (s.title) { const b = document.createElement('b'); b.textContent = s.title; title.appendChild(b); }
    else if (ch) title.textContent = 'No guide data';
    $('npTime').textContent = s.title && s.time ? s.time : '';
    $('npNext').textContent = s.next ? 'Next: ' + s.next : '';
    const favs = $('favs');
    favs.textContent = '';
    const list = Array.isArray(s.favorites) ? s.favorites : [];
    if (!list.length) {
      const p = document.createElement('p');
      p.className = 'empty';
      p.textContent = 'Star channels in Dial TV to see them here.';
      favs.appendChild(p);
    }
    for (const f of list) {
      const b = document.createElement('button');
      b.className = 'fav' + (s.currentId === f.id ? ' on' : '');
      const n = document.createElement('b'); n.textContent = String(f.number ?? '');
      const t = document.createElement('span'); t.textContent = String(f.name ?? '');
      b.append(n, t);
      b.addEventListener('click', () => send({ type: 'tune', id: f.id }));
      favs.appendChild(b);
    }
  }

  for (const b of document.querySelectorAll('[data-cmd]')) b.addEventListener('click', () => send({ type: b.dataset.cmd }));

  // Number pad: type a channel number, GO (or wait 2 s) to tune.
  let digits = '';
  let digitTimer = 0;
  const showDigits = () => { $('entry').textContent = digits; };
  const go = () => { clearTimeout(digitTimer); if (digits) send({ type: 'number', value: digits }); digits = ''; showDigits(); };
  for (const b of document.querySelectorAll('[data-d]')) b.addEventListener('click', () => {
    if (digits.length >= 5) return;
    digits += b.dataset.d;
    showDigits();
    clearTimeout(digitTimer);
    digitTimer = setTimeout(go, 2000);
  });
  $('padGo').addEventListener('click', go);
  $('padClear').addEventListener('click', () => { clearTimeout(digitTimer); digits = ''; showDigits(); });
  $('padToggle').addEventListener('click', () => {
    const pad = $('pad');
    const open = pad.classList.toggle('hidden') === false;
    $('padToggle').setAttribute('aria-expanded', String(open));
  });

  if (token) { show('remote'); connect(); } else show('pair');
})();
</script>
</body>
</html>
