name: Desktop apps
# Builds the Mac (Apple Silicon + Intel) and Windows apps, then TESTS the packaged Mac apps on real
# Macs of each kind with the stream lab: every broadcast format must play with picture AND sound.
#
# COST: private-repo minutes are billed; macOS minutes count 10x, Windows 2x.
#   Run workflow (manual) = Mac build only by default (~15 Mac min ≈ 150 billed). Tick boxes to add tests.
#   Tag push (v*)          = Mac build + Apple Silicon test + Windows (~25 Mac min + ~10 Win ≈ 270 billed).
#   The Intel Mac test only runs when ticked on a manual run.
# Don't trigger runs casually: verify on Windows locally first and batch fixes into one release.
on:
  workflow_dispatch:
    inputs:
      mac_test_arm:
        description: Test the Apple Silicon app on a real Mac (+~8 Mac min ≈ 80 billed)
        type: boolean
        default: false
      mac_test_intel:
        description: Test the Intel app on a real Intel Mac (+~8 Mac min ≈ 80 billed)
        type: boolean
        default: false
      windows:
        description: Build + install-test Windows (+~10 Windows min ≈ 20 billed)
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: write

# A newer run replaces an older one still going (no paying for superseded builds).
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides which (expensive) Mac test jobs run: tags test Apple Silicon; manual runs test only what's ticked.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      any: ${{ steps.m.outputs.any }}
    steps:
      - id: m
        run: |
          items=()
          if [ "${{ startsWith(github.ref, 'refs/tags/') || inputs.mac_test_arm == true }}" = "true" ]; then items+=('{"runner":"macos-latest","zip":"arm64"}'); fi
          if [ "${{ inputs.mac_test_intel == true }}" = "true" ]; then items+=('{"runner":"macos-15-intel","zip":"x64"}'); fi
          echo "matrix=[$(IFS=,; echo "${items[*]}")]" >> "$GITHUB_OUTPUT"
          if [ ${#items[@]} -gt 0 ]; then echo "any=true" >> "$GITHUB_OUTPUT"; else echo "any=false" >> "$GITHUB_OUTPUT"; fi

  mac-build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Stop Spotlight indexing (it holds mounted DMG volumes busy)
        run: sudo mdutil -a -i off || true
      - name: Build Dial TV.app (arm64 + x64) + DMGs
        run: npm run dist:mac
        env:
          # With an Apple Developer ID, add CSC_LINK / CSC_KEY_PASSWORD / APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD /
          # APPLE_TEAM_ID secrets and set "identity" + "notarize" in package.json: no Gatekeeper prompt at all.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify bundles (signature, architecture, bundled decoder)
        timeout-minutes: 5
        run: |
          set -e
          check() {
            APP="$1"; ARCH="$2"; echo "== $APP (expect $ARCH)"
            codesign --verify --deep --strict --verbose=2 "$APP"
            FF="$APP/Contents/Resources/ffmpeg/ffmpeg"
            codesign --verify --verbose=2 "$FF"
            [ "$(lipo -archs "$APP/Contents/MacOS/Dial TV")" = "$ARCH" ] || { echo "app arch wrong: $(lipo -archs "$APP/Contents/MacOS/Dial TV")"; exit 1; }
            [ "$(lipo -archs "$FF")" = "$ARCH" ] || { echo "ffmpeg arch wrong: $(lipo -archs "$FF")"; exit 1; }
          }
          check "release/mac-arm64/Dial TV.app" arm64
          check "release/mac/Dial TV.app" x86_64
          FF="release/mac-arm64/Dial TV.app/Contents/Resources/ffmpeg/ffmpeg"
          "$FF" -hide_banner -version | head -1
          for d in mpeg2video ac3 eac3 mp2 hevc h264; do "$FF" -hide_banner -decoders | grep -qE " $d " && echo "decoder $d OK" || { echo "decoder $d MISSING"; exit 1; }; done
          "$FF" -hide_banner -encoders | grep -q libx264 && echo "encoder libx264 OK" || { echo "libx264 MISSING"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: Dial-TV-mac
          path: |
            release/*.dmg
            release/*.zip

  mac-test:
    needs: [plan, mac-build]
    if: needs.plan.outputs.any == 'true'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: Dial-TV-mac, path: dl }
      - name: Unpack the packaged app (as a user would, including the browser quarantine flag)
        run: |
          ZIP="$(ls dl/Dial-TV-*-mac-${{ matrix.zip }}.zip)"
          xattr -w com.apple.quarantine "0081;$(printf %x $(date +%s));Safari;" "$ZIP"
          ditto -x -k "$ZIP" app
          xattr -r "app/Dial TV.app" | head -3 || true
          # What "Open Anyway" does for the user: clear the quarantine on the app bundle.
          xattr -dr com.apple.quarantine "app/Dial TV.app"
          ls app
          uname -m
          FF="app/Dial TV.app/Contents/Resources/ffmpeg/ffmpeg"
          "$FF" -hide_banner -version | head -1
          for d in mpeg2video ac3 eac3 mp2; do "$FF" -hide_banner -decoders | grep -qE " $d " && echo "decoder $d OK" || { echo "decoder $d MISSING"; exit 1; }; done
      - name: Generate broadcast-format test streams
        run: |
          node tests/streamlab/generate.mjs
          for f in mpeg2_ac3 mpeg2_mp2 h264_ac3 h264_eac3 h264_aac; do test -f tests/streamlab/media/$f.ts || { echo "missing $f"; exit 1; }; done
      - name: Play every format in the packaged app (picture AND sound)
        timeout-minutes: 15
        run: |
          node tests/streamlab/server.mjs &
          sleep 2
          DIAL_PROFILE=ci "app/Dial TV.app/Contents/MacOS/Dial TV" --remote-debugging-port=9350 &
          sleep 15
          node tests/streamlab/check.mjs 9350

  windows:
    if: startsWith(github.ref, 'refs/tags/') || inputs.windows == true
    timeout-minutes: 30
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
      - name: Verify Windows build (exe = stock Electron for Smart App Control, ffmpeg bundled, app launches)
        shell: pwsh
        run: |
          $a = (Get-FileHash "release/win-unpacked/Dial TV.exe").Hash
          $b = (Get-FileHash "node_modules/electron/dist/electron.exe").Hash
          if ($a -ne $b) { Write-Error "Dial TV.exe differs from stock electron.exe"; exit 1 }
          if (-not (Test-Path "release/win-unpacked/resources/ffmpeg/ffmpeg.exe")) { Write-Error "ffmpeg missing"; exit 1 }
          & "release/win-unpacked/resources/ffmpeg/ffmpeg.exe" -hide_banner -version | Select-Object -First 1
          $env:DIAL_PROFILE = "ci"
          $p = Start-Process "release/win-unpacked/Dial TV.exe" -PassThru
          Start-Sleep 15
          if ($p.HasExited) { Write-Error "app exited early"; exit 1 }
          Stop-Process -Id $p.Id -Force
      - name: Self-installer (zip with Mark of the Web, install, shortcuts, launch, update, uninstall)
        shell: pwsh
        run: ./tests/install/win-install-test.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Dial-TV-windows
          path: release/Dial-TV-*-win.zip

  release:
    if: startsWith(github.ref, 'refs/tags/') && !cancelled() && !failure()
    needs: [mac-build, mac-test, windows]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            out/*.dmg
            out/*.zip
