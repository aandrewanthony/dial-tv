name: Desktop apps
# Builds the Mac (universal: Apple Silicon + Intel) and Windows apps.
# Run it from the Actions tab ("Run workflow"), or push a tag like v0.2.0 to also attach them to a draft release.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - name: Build Dial TV.app + DMG
        run: npm run dist:mac
        env:
          # With an Apple Developer ID, add CSC_LINK / CSC_KEY_PASSWORD / APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD /
          # APPLE_TEAM_ID secrets and set "identity" + "notarize" in package.json → no Gatekeeper prompt at all.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify the app bundle is validly signed (ad-hoc) and launches
        run: |
          APP="$(find release -maxdepth 2 -name 'Dial TV.app' | head -1)"
          echo "App: $APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          lipo -archs "$APP/Contents/MacOS/Dial TV"
          "$APP/Contents/MacOS/Dial TV" --version || true
          ( "$APP/Contents/MacOS/Dial TV" & PID=$!; sleep 15; kill -0 $PID && echo "launched OK"; kill $PID ) 
      - uses: actions/upload-artifact@v4
        with:
          name: Dial-TV-mac
          path: |
            release/*.dmg
            release/*.zip
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            release/*.dmg
            release/*.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: Dial-TV-windows
          path: |
            release/Dial-TV-Setup-*.exe
            release/Dial-TV-Portable-*.exe
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            release/Dial-TV-Setup-*.exe
            release/Dial-TV-Portable-*.exe
