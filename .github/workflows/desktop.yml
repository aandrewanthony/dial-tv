name: Desktop apps
# Builds the Mac (Apple Silicon + Intel) and Windows apps, then TESTS the packaged Mac apps on real
# Macs of each kind with the stream lab: every broadcast format must play with picture AND sound.
# Run from the Actions tab ("Run workflow"), or push a tag like v0.4.0 to attach them to a draft release.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  mac-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - name: Build Dial TV.app (arm64 + x64) + DMGs
        run: npm run dist:mac
        env:
          # With an Apple Developer ID, add CSC_LINK / CSC_KEY_PASSWORD / APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD /
          # APPLE_TEAM_ID secrets and set "identity" + "notarize" in package.json: no Gatekeeper prompt at all.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify bundles (signature, architecture, bundled decoder)
        timeout-minutes: 5
        run: |
          set -e
          check() {
            APP="$1"; ARCH="$2"; echo "== $APP (expect $ARCH)"
            codesign --verify --deep --strict --verbose=2 "$APP"
            FF="$APP/Contents/Resources/ffmpeg/ffmpeg"
            codesign --verify --verbose=2 "$FF"
            [ "$(lipo -archs "$APP/Contents/MacOS/Dial TV")" = "$ARCH" ] || { echo "app arch wrong: $(lipo -archs "$APP/Contents/MacOS/Dial TV")"; exit 1; }
            [ "$(lipo -archs "$FF")" = "$ARCH" ] || { echo "ffmpeg arch wrong: $(lipo -archs "$FF")"; exit 1; }
          }
          check "release/mac-arm64/Dial TV.app" arm64
          check "release/mac/Dial TV.app" x86_64
          FF="release/mac-arm64/Dial TV.app/Contents/Resources/ffmpeg/ffmpeg"
          "$FF" -hide_banner -version | head -1
          for d in mpeg2video ac3 eac3 mp2 hevc h264; do "$FF" -hide_banner -decoders | grep -qE " $d " && echo "decoder $d OK" || { echo "decoder $d MISSING"; exit 1; }; done
          "$FF" -hide_banner -encoders | grep -q libx264 && echo "encoder libx264 OK" || { echo "libx264 MISSING"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: Dial-TV-mac
          path: |
            release/*.dmg
            release/*.zip

  mac-test:
    needs: mac-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest       # Apple Silicon
            zip: arm64
          - runner: macos-15-intel     # Intel
            zip: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: Dial-TV-mac, path: dl }
      - name: Unpack the packaged app (as a user would, including the browser quarantine flag)
        run: |
          ZIP="$(ls dl/Dial-TV-*-mac-${{ matrix.zip }}.zip)"
          xattr -w com.apple.quarantine "0081;$(printf %x $(date +%s));Safari;" "$ZIP"
          ditto -x -k "$ZIP" app
          xattr -r "app/Dial TV.app" | head -3 || true
          # What "Open Anyway" does for the user: clear the quarantine on the app bundle.
          xattr -dr com.apple.quarantine "app/Dial TV.app"
          ls app
          uname -m
          FF="app/Dial TV.app/Contents/Resources/ffmpeg/ffmpeg"
          "$FF" -hide_banner -version | head -1
          for d in mpeg2video ac3 eac3 mp2; do "$FF" -hide_banner -decoders | grep -qE " $d " && echo "decoder $d OK" || { echo "decoder $d MISSING"; exit 1; }; done
      - name: Generate broadcast-format test streams
        run: |
          node tests/streamlab/generate.mjs
          for f in mpeg2_ac3 mpeg2_mp2 h264_ac3 h264_eac3 h264_aac; do test -f tests/streamlab/media/$f.ts || { echo "missing $f"; exit 1; }; done
      - name: Play every format in the packaged app (picture AND sound)
        timeout-minutes: 15
        run: |
          node tests/streamlab/server.mjs &
          sleep 2
          DIAL_PROFILE=ci "app/Dial TV.app/Contents/MacOS/Dial TV" --remote-debugging-port=9350 &
          sleep 15
          node tests/streamlab/check.mjs 9350

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
      - name: Verify Windows build (exe = stock Electron for Smart App Control, ffmpeg bundled, app launches)
        shell: pwsh
        run: |
          $a = (Get-FileHash "release/win-unpacked/Dial TV.exe").Hash
          $b = (Get-FileHash "node_modules/electron/dist/electron.exe").Hash
          if ($a -ne $b) { Write-Error "Dial TV.exe differs from stock electron.exe"; exit 1 }
          if (-not (Test-Path "release/win-unpacked/resources/ffmpeg/ffmpeg.exe")) { Write-Error "ffmpeg missing"; exit 1 }
          & "release/win-unpacked/resources/ffmpeg/ffmpeg.exe" -hide_banner -version | Select-Object -First 1
          $env:DIAL_PROFILE = "ci"
          $p = Start-Process "release/win-unpacked/Dial TV.exe" -PassThru
          Start-Sleep 15
          if ($p.HasExited) { Write-Error "app exited early"; exit 1 }
          Stop-Process -Id $p.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Dial-TV-windows
          path: |
            release/Dial-TV-Setup-*.exe
            release/Dial-TV-Portable-*.exe
            release/Dial-TV-*-win.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [mac-test, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            out/*.dmg
            out/*.zip
            out/*.exe
