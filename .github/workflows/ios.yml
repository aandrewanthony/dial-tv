name: iPad app
# Builds the unsigned iPad / iPhone app (.ipa) for sideloading (Sideloadly signs it with your Apple ID).
# Manual only: Actions -> iPad app -> Run workflow. COST: ~10-15 macOS min (billed 10x on private repos).
on:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm run build
      - name: App icon (1024, no transparency)
        run: |
          sips -s format jpeg -s formatOptions 100 build/icon.png --out /tmp/icon.jpg
          sips -s format png -z 1024 1024 /tmp/icon.jpg --out ios/Sources/Assets.xcassets/AppIcon.appiconset/icon.png
      - name: Generate the Xcode project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          cd ios && xcodegen generate
      - name: Build (unsigned)
        run: |
          cd ios
          xcodebuild -project DialTV.xcodeproj -scheme DialTV -configuration Release -sdk iphoneos \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > /tmp/xcodebuild.log 2>&1 || true
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" /tmp/xcodebuild.log | head -60 || true
          test -d build/Build/Products/Release-iphoneos/DialTV.app || { tail -80 /tmp/xcodebuild.log; exit 1; }
      - name: Package .ipa
        run: |
          cd ios
          APP=build/Build/Products/Release-iphoneos/DialTV.app
          test -f "$APP/dist/index.html" || { echo "web app missing from bundle"; ls "$APP"; exit 1; }
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry "Dial-TV-$(node -p "require('../package.json').version")-ipad.ipa" Payload
          ls -la *.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Dial-TV-ipad
          path: ios/*.ipa
